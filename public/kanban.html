<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<title>DSH カンバン</title>
		<link rel="stylesheet" href="./assets/tokens.css" />
		<style>
			/* /kanban — the operations board, read at desk distance.
			 * Layout only; tokens and shared primitives live in tokens.css.
			 * Read DESIGN.md §3.2.
			 *
			 * Three neutral layers, as a dense dark UI needs: page (--bg) <
			 * column surface (--panel-3) < card (--panel + hairline). The
			 * column deliberately has a background but NO border, so a card
			 * is never a bordered box inside another bordered box. */

			#board {
				height: 100dvh;
				display: grid;
				grid-template-rows: auto auto minmax(0, 1fr) auto;
				gap: var(--s3);
				padding: var(--s4);
				overflow: hidden;
			}

			/* ── header ─────────────────────────────────────────────────── */
			.head {
				display: flex;
				align-items: center;
				gap: var(--s4);
				min-height: 34px;
			}

			.brand {
				font-size: 15px;
				font-weight: 600;
				letter-spacing: 0.16em;
				color: var(--ink);
			}

			.head-spacer {
				margin-left: auto;
			}

			.head-meta {
				display: flex;
				align-items: center;
				gap: var(--s4);
				font-size: 12px;
				color: var(--ink-3);
				min-width: 0;
			}

			.head-meta .v {
				color: var(--ink-2);
			}

			#clock {
				font-size: 14px;
				color: var(--ink-2);
			}

			.jump {
				font-size: 12px;
				padding: 5px 10px;
				border: 1px solid var(--line);
				border-radius: var(--r);
				text-decoration: none;
				color: var(--ink-2);
				white-space: nowrap;
			}

			.jump:hover {
				color: var(--ink);
				border-color: var(--ink-4);
			}

			/* ── vitals strip ───────────────────────────────────────────── */
			.vitals {
				display: flex;
				align-items: stretch;
				border: 1px solid var(--line-soft);
				border-radius: var(--r);
				background: var(--panel-3);
				overflow: hidden;
			}

			.vital {
				flex: 1 1 0;
				min-width: 0;
				display: flex;
				flex-direction: column;
				gap: 3px;
				padding: var(--s2) var(--s4);
				border-left: 1px solid var(--line-soft);
			}

			.vital:first-child {
				border-left: 0;
			}

			.vital-l {
				font-size: 11px;
				letter-spacing: 0.04em;
				color: var(--ink-3);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.vital-v {
				font-size: 20px;
				line-height: 1.15;
				color: var(--ink);
				white-space: nowrap;
			}

			/* The breakdown line is what keeps this strip from being six
			 * numbers with no meaning. It replaces a second row of duplicated
			 * counters. */
			.vital-h {
				font-size: 10px;
				line-height: 1.2;
				color: var(--ink-3);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}

			.vital-v .unit {
				font-size: 12px;
				color: var(--ink-3);
				margin-left: 2px;
			}

			.gauge {
				margin-top: 4px;
			}

			/* ── columns ────────────────────────────────────────────────── */
			.cols {
				display: grid;
				grid-template-columns: repeat(4, minmax(0, 1fr));
				gap: var(--s3);
				min-height: 0;
			}

			.col {
				display: flex;
				flex-direction: column;
				min-height: 0;
				background: var(--panel-3);
				border-radius: var(--r);
				overflow: hidden;
			}

			.col-hd {
				display: flex;
				align-items: baseline;
				gap: var(--s2);
				padding: var(--s3) var(--s3) var(--s2);
				border-bottom: 1px solid var(--line-soft);
			}

			.col-name {
				font-size: 12px;
				letter-spacing: 0.08em;
				color: var(--ink-2);
			}

			/* The only filled colour on the page: the needs-you count, and
			 * only while it is non-zero. */
			.col-n {
				margin-left: auto;
				font-size: 12px;
				color: var(--ink-3);
			}

			.col[data-col="alert"] .col-n[data-hot="1"] {
				color: #ffd9da;
				background: rgba(229, 72, 77, 0.18);
				border: 1px solid rgba(229, 72, 77, 0.5);
				border-radius: var(--r);
				padding: 1px 6px;
			}

			.col-body {
				flex: 1;
				min-height: 0;
				overflow-y: auto;
				overscroll-behavior: contain;
				padding: var(--s3);
				display: flex;
				flex-direction: column;
				gap: var(--s3);
			}

			.col-body .empty {
				margin: 0;
				padding: var(--s6) var(--s3);
				font-size: 12px;
				border-style: dashed;
			}

			/* ── card ───────────────────────────────────────────────────── */
			/* A <button>: it is clickable, so it must be reachable by keyboard
			 * and activate on Enter without any extra JS. */
			.card {
				display: block;
				width: 100%;
				text-align: left;
				font: inherit;
				color: inherit;
				appearance: none;
				cursor: pointer;
				background: var(--panel);
				border: 1px solid var(--line-soft);
				border-radius: var(--r);
				padding: var(--s3);
				transition: border-color 120ms linear, transform 120ms ease-out;
			}

			.card:hover {
				border-color: var(--line);
			}

			.card:active {
				transform: translateY(1px);
			}

			.card-top {
				display: flex;
				align-items: flex-start;
				gap: var(--s2);
			}

			.card-title {
				font-size: 13px;
				line-height: 1.4;
				font-weight: 600;
				color: var(--ink);
				display: -webkit-box;
				-webkit-line-clamp: 2;
				-webkit-box-orient: vertical;
				overflow: hidden;
				word-break: break-word;
			}

			.card-title[data-empty="1"] {
				color: var(--ink-3);
				font-weight: 400;
			}

			.card-sub {
				margin-top: 3px;
				font-size: 11px;
				color: var(--ink-3);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.card-foot {
				display: flex;
				align-items: center;
				gap: var(--s2);
				margin-top: var(--s2);
			}

			.card-age {
				font-size: 11px;
				color: var(--ink-3);
				margin-left: auto;
				white-space: nowrap;
			}

			.card-metrics {
				display: flex;
				gap: var(--s3);
				margin-top: var(--s2);
				padding-top: var(--s2);
				border-top: 1px solid var(--line-soft);
			}

			.metric {
				display: flex;
				align-items: baseline;
				gap: 4px;
				min-width: 0;
			}

			.metric-l {
				font-size: 10px;
				color: var(--ink-4);
				white-space: nowrap;
			}

			.metric-v {
				font-size: 12px;
				color: var(--ink-2);
			}

			.card-progress {
				display: flex;
				align-items: center;
				gap: var(--s2);
				margin-top: var(--s2);
			}

			.card-progress .bar {
				flex: 1;
			}

			.card-progress .n {
				font-size: 10px;
				color: var(--ink-3);
			}

			.foot {
				display: flex;
				align-items: center;
				gap: var(--s3);
			}

			#col-alert .foot {
				display: none;
			}

			/* ── activity ───────────────────────────────────────────────── */
			/* Fixed-height rows with hairline separators: a log is a log, and
			 * blank slots below the last entry look like room rather than a
			 * layout that gave up. Severity is a dot — never the body colour,
			 * because red-on-dark copy is unreadable. */
			.act {
				display: flex;
				flex-direction: column;
				border: 1px solid var(--line-soft);
				border-radius: var(--r);
				background: var(--panel-3);
				overflow: hidden;
			}

			.act-hd {
				display: flex;
				align-items: center;
				gap: var(--s2);
				padding: var(--s2) var(--s3);
				border-bottom: 1px solid var(--line-soft);
				font-size: 11px;
				letter-spacing: 0.08em;
				color: var(--ink-3);
			}

			.act-rows {
				padding: 0 var(--s3) var(--s2);
				overflow: hidden;
			}

			.arow {
				display: grid;
				grid-template-columns: 6ch 7px minmax(0, 1fr);
				gap: var(--s2);
				align-items: center;
				height: 28px;
				border-top: 1px solid var(--line-soft);
			}

			.arow:first-child {
				border-top: 0;
			}

			.adot {
				width: 7px;
				height: 7px;
				border-radius: 50%;
				background: var(--ink-4);
			}

			.arow[data-sev="ok"] .adot {
				background: var(--ok);
			}
			.arow[data-sev="warn"] .adot {
				background: var(--warn);
			}
			.arow[data-sev="alert"] .adot {
				background: var(--alert);
			}

			.atime {
				font-size: 11px;
				color: var(--ink-4);
				text-align: right;
			}

			.atext {
				font-size: 12px;
				color: var(--ink-2);
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.arow[data-sev="alert"] .atext {
				color: var(--ink);
			}

			/* ── connection band ────────────────────────────────────────── */
			.err {
				grid-column: 1 / -1;
				display: none;
				align-items: center;
				gap: var(--s3);
				padding: var(--s2) var(--s3);
				border: 1px solid rgba(229, 72, 77, 0.5);
				border-radius: var(--r);
				background: rgba(229, 72, 77, 0.1);
				color: var(--alert);
				font-size: 13px;
			}

			body[data-down="1"] .err {
				display: flex;
			}

			body[data-down="1"] .act,
			body[data-down="1"] .vitals {
				border-color: var(--line-soft);
			}

			/* ── detail drawer ──────────────────────────────────────────── */
			/* Native <dialog>: focus trapping, Esc-to-close and ::backdrop come
			 * for free, and being top-layer it cannot be clipped by a column's
			 * overflow — which an absolutely positioned drawer would be. */
			#drawer {
				position: fixed;
				inset: 0 0 0 auto;
				width: min(440px, 92vw);
				height: 100dvh;
				max-height: 100dvh;
				margin: 0;
				padding: 0;
				border: 0;
				border-left: 1px solid var(--line);
				border-radius: 0;
				background: var(--panel);
				color: var(--ink);
				overflow-y: auto;
			}

			#drawer::backdrop {
				background: rgba(0, 0, 0, 0.55);
			}

			.dw-hd {
				display: flex;
				align-items: center;
				gap: var(--s3);
				padding: var(--s4);
				border-bottom: 1px solid var(--line-soft);
				position: sticky;
				top: 0;
				background: var(--panel);
			}

			.dw-title {
				font-size: 15px;
				line-height: 1.4;
				font-weight: 600;
				flex: 1;
				min-width: 0;
			}

			.dw-close {
				font: inherit;
				font-size: 12px;
				color: var(--ink-2);
				background: transparent;
				border: 1px solid var(--line);
				border-radius: var(--r);
				padding: 5px 10px;
				cursor: pointer;
				flex: none;
			}

			.dw-close:hover {
				color: var(--ink);
			}

			.dw-body {
				padding: var(--s4);
			}

			.dw-pills {
				display: flex;
				flex-wrap: wrap;
				gap: var(--s2);
				margin-bottom: var(--s4);
			}

			.dw-rows {
				display: flex;
				flex-direction: column;
			}

			.dw-row {
				display: grid;
				grid-template-columns: 11ch minmax(0, 1fr);
				gap: var(--s3);
				padding: var(--s2) 0;
				border-top: 1px solid var(--line-soft);
			}

			.dw-row:first-child {
				border-top: 0;
			}

			.dw-k {
				font-size: 11px;
				color: var(--ink-3);
			}

			.dw-v {
				font-size: 12px;
				color: var(--ink-2);
				word-break: break-word;
				white-space: pre-wrap;
			}

			@media (max-width: 1100px) {
				.cols {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}

			@media (max-width: 760px) {
				.cols {
					grid-template-columns: minmax(0, 1fr);
				}
				.vitals {
					flex-wrap: wrap;
				}
				.vital {
					flex: 1 1 40%;
				}
			}
		</style>
	</head>
	<body>
		<!-- Full static shell, same principle as /andon: a dead script leaves a
		     legible board of labels and dashes, not a blank screen. -->
		<main id="board">
			<header class="head">
				<span class="brand">DSH KANBAN</span>
				<div class="conn" id="conn" data-state="ok">
					<i class="conn-dot"></i><span data-role="conn-label">LIVE</span>
				</div>
				<div class="head-spacer"></div>
				<div class="head-meta">
					<span>モデル <span class="v" id="h-model">—</span></span>
					<span>トークン <span class="v num" id="h-tokens">—</span></span>
					<span>稼働 <span class="v num" id="h-uptime">—</span></span>
					<span class="num" id="clock">--:--:--</span>
					<a class="jump" href="/andon">アンドン</a>
				</div>
			</header>

			<section class="err" id="err">
				<span>DSH に接続できません</span><span class="num" id="err-at"></span>
			</section>

			<section class="vitals" aria-label="全体">
				<div class="vital">
					<span class="vital-l">エージェント</span>
					<span class="vital-v num live-value" id="v-running">—</span>
					<span class="vital-h" id="v-agents-hint">—</span>
				</div>
				<div class="vital">
					<span class="vital-l">ジョブ</span>
					<span class="vital-v num live-value" id="v-jobs">—</span>
					<span class="vital-h" id="v-jobs-hint">—</span>
				</div>
				<div class="vital">
					<span class="vital-l">目標</span>
					<span class="vital-v num live-value" id="v-goals">—</span>
					<span class="vital-h" id="v-goals-hint">—</span>
				</div>
				<div class="vital">
					<span class="vital-l">文脈</span>
					<span class="vital-v num live-value"
						><span id="v-context-n">—</span><span class="unit">%</span></span
					>
					<div class="bar gauge"><i id="v-context-bar" style="width: 0%"></i></div>
				</div>
				<div class="vital">
					<span class="vital-l">作業ディレクトリ</span>
					<span class="vital-v live-value" id="v-workspace" style="font-size: 14px">—</span>
					<span class="vital-h num" id="v-sessions-hint">—</span>
				</div>
			</section>

			<section class="cols">
				<div class="col" id="col-alert" data-col="alert">
					<header class="col-hd">
						<span class="col-name">要対応</span><span class="col-n num" data-hot="0">—</span>
					</header>
					<div class="col-body"></div>
				</div>
				<div class="col" id="col-running" data-col="running">
					<header class="col-hd">
						<span class="col-name">実行中</span><span class="col-n num">—</span>
					</header>
					<div class="col-body"></div>
				</div>
				<div class="col" id="col-queued" data-col="queued">
					<header class="col-hd">
						<span class="col-name">待機</span><span class="col-n num">—</span>
					</header>
					<div class="col-body"></div>
				</div>
				<div class="col" id="col-done" data-col="done">
					<header class="col-hd">
						<span class="col-name">完了・直近</span><span class="col-n num">—</span>
					</header>
					<div class="col-body"></div>
				</div>
			</section>

			<section class="act">
				<header class="act-hd">
					<span>アクティビティ</span><span class="num" id="act-n" style="margin-left: auto">—</span>
				</header>
				<div class="act-rows" id="act-rows"></div>
			</section>
		</main>

		<dialog id="drawer" aria-labelledby="dw-title">
			<div class="dw-hd">
				<span class="dw-title" id="dw-title">—</span>
				<button class="dw-close" id="dw-close" type="button">閉じる</button>
			</div>
			<div class="dw-body">
				<div class="dw-pills" id="dw-pills"></div>
				<div class="dw-rows" id="dw-rows"></div>
			</div>
		</dialog>

		<script type="module" src="./assets/kanban.js"></script>
	</body>
</html>
